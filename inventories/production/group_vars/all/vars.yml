---
# Global
domain: "{{ vault_domain }}"

# Unbound configuration - forward all DNS queries to Cloudflare
unbound_interfaces:
  - 127.0.0.1
  - ::1
  - 192.168.0.1

# After switching to systemd-networkd, some services like unbound fails to start because
# the LAN address has not been configured when unbound tries to start.
# This option allows us to bind to an IP address that does not exist yet.
unbound_ip_freebind: true

unbound_access_control:
  - 192.168.0.0/24 allow

unbound_extended_statistics: true

unbound_forward_zones:
  - name: "."
    forward_addresses:
      - 1.1.1.1
      - 1.0.0.1

unbound_local_zones:
  - name: int.{{ domain }}.
    type: static
    records:
      - name: "perses"
        type: "A"
        value: "192.168.0.1"
      - name: "smokeping"
        type: "A"
        value: "192.168.0.1"

# Prometheus node exporter configuration
prometheus_node_exporter_listen_address: :9100

# Caddy server
caddy_config: |
  (internal_tls) {
      tls /etc/ssl/acmesh/int.{{ domain }}/fullchain.pem /etc/ssl/acmesh/int.{{ domain }}/key.pem
  }

  (internal_acl) {
      @denied not remote_ip 192.168.0.0/24
      abort @denied
  }

  {{ domain }} {
      redir https://www.{host}{uri}
  }

  www.{{ domain }} {
      respond "Hello!"
  }

  perses.int.{{ domain }} {
      import internal_acl
      import internal_tls

      reverse_proxy 192.168.0.1:8888
  }
